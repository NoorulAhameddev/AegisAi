name: Prisma Migrate Dry Run

on:
  pull_request:
    paths:
      - 'prisma/**'
      - 'infra/**'
      - '.github/workflows/**'

jobs:
  migrate-dry-run:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aegis_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run Prisma migrations against an ephemeral database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aegis_migration_test
        run: npx prisma migrate deploy --schema=prisma/schema.prisma
