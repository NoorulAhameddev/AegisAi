name: Prisma Migrate Dry Run

on:
  pull_request:
    paths:
      - 'prisma/**'
      - 'infra/**'
      - '.github/workflows/**'

jobs:
  migrate-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run Prisma migrate dry-run
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          npx prisma migrate deploy --preview-feature --schema=prisma/schema.prisma --print
