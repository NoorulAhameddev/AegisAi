name: Regenerate dependency lockfile (temporary)

on:
  push:
    branches:
      - fix/security-workflow-audit-gate

permissions:
  contents: write

concurrency:
  group: lockfile-regeneration
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-workflow-audit-gate
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate lockfile from workspace manifests
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already up to date."
            exit 0
          fi
          git commit -m "Regenerate lockfile after dependency fixes"
          git push origin HEAD:fix/security-workflow-audit-gate
