name: Regenerate workspace lockfile (temporary)

on:
  push:
    branches: [fix/security-workflow-audit-gate]

permissions:
  contents: write

concurrency:
  group: aegis-lock-update-final-v3
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile, apply compatible fixes, and verify npm ci
        run: |
          cp package-lock.json /tmp/package-lock.backup.json
          rm package-lock.json
          if ! npm install --package-lock-only --ignore-scripts --no-audit --no-fund; then
            cp /tmp/package-lock.backup.json package-lock.json
            exit 1
          fi
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high || true
      - name: Commit lockfile
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh lockfile with patched dependency overrides"
          git fetch origin "$HEAD_BRANCH"
          git rebase "origin/$HEAD_BRANCH"
          git push origin "HEAD:$HEAD_BRANCH"
