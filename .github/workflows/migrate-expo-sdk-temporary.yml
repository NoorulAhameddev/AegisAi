name: Migrate mobile app to Expo SDK 58 (temporary)

on:
  push:
    branches: [fix/security-workflow-audit-gate]

permissions:
  contents: write

concurrency:
  group: aegis-expo-sdk-migration
  cancel-in-progress: true

jobs:
  align-mobile-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Align Expo SDK packages and refresh lockfile
        run: |
          npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps
          cd apps/mobile
          npx expo install --fix
          cd ../..
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high || true
      - name: Commit aligned Expo packages and lockfile
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          git add -- apps/mobile/package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Expo dependencies and lockfile already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Upgrade mobile app to Expo SDK 58"
          git fetch origin "$HEAD_BRANCH"
          git rebase "origin/$HEAD_BRANCH"
          git push origin "HEAD:$HEAD_BRANCH"
