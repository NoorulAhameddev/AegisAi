name: Deploy

on:
  workflow_dispatch:
    inputs:
      apply_terraform:
        description: 'Run terraform apply'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Test
        run: npm run test --workspaces --if-present
        env:
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/aegis_test

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/aegis_test

      - name: Build
        run: npm run build
        env:
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/aegis_test

  terraform:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infra/aws/terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: infra/aws/terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra/aws/terraform
        env:
          TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}
          TF_VAR_slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: ${{ inputs.apply_terraform == true || secrets.TF_APPLY == 'true' }}
        working-directory: infra/aws/terraform
        env:
          TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}
          TF_VAR_slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: terraform apply -auto-approve tfplan

  ecs-deploy:
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - name: Configure AWS Credentials
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Force New ECS Deployments
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE_API: ${{ secrets.ECS_SERVICE_API }}
          ECS_SERVICE_WORKER: ${{ secrets.ECS_SERVICE_WORKER }}
          ECS_SERVICE_RAG: ${{ secrets.ECS_SERVICE_RAG }}
          ECS_SERVICE_WEBSOCKET: ${{ secrets.ECS_SERVICE_WEBSOCKET }}
        run: |
          if [ -n "$ECS_SERVICE_API" ] && [ -n "$ECS_CLUSTER" ]; then aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE_API" --force-new-deployment; fi
          if [ -n "$ECS_SERVICE_WORKER" ] && [ -n "$ECS_CLUSTER" ]; then aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE_WORKER" --force-new-deployment; fi
          if [ -n "$ECS_SERVICE_RAG" ] && [ -n "$ECS_CLUSTER" ]; then aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE_RAG" --force-new-deployment; fi
          if [ -n "$ECS_SERVICE_WEBSOCKET" ] && [ -n "$ECS_CLUSTER" ]; then aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE_WEBSOCKET" --force-new-deployment; fi
