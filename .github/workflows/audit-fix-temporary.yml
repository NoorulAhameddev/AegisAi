name: Apply compatible dependency security updates (temporary)

on:
  push:
    branches: [fix/security-workflow-audit-gate]

permissions:
  contents: write

concurrency:
  group: aegis-lock-regenerate-final-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply semver-compatible security fixes
        run: |
          cp package-lock.json /tmp/package-lock.backup.json
          rm package-lock.json
          if ! npm install --package-lock-only --ignore-scripts --no-audit --no-fund; then
            cp /tmp/package-lock.backup.json package-lock.json
            exit 1
          fi
          npm audit --omit=dev --audit-level=high || true
      - name: Commit updated dependency lockfile
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          git add -A -- package-lock.json package.json apps
          if [ -d packages ]; then git add -A -- packages; fi
          if [ -d services ]; then git add -A -- services; fi
          if git diff --cached --quiet; then
            echo "npm audit fix did not produce tracked manifest or lockfile changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply semver-compatible dependency security updates"
          git fetch origin "$HEAD_BRANCH"
          git rebase "origin/$HEAD_BRANCH"
          git push origin "HEAD:$HEAD_BRANCH"
