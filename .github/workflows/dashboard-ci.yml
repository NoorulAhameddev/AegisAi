name: Dashboard CI

on:
  push:
    paths:
      - 'apps/dashboard/**'
  pull_request:
    paths:
      - 'apps/dashboard/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Run dashboard tests
        run: npx jest "apps/dashboard/__tests__" --runInBand --colors
        env:
          CI: true
