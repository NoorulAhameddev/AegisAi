name: Feature Request
description: Suggest an idea to improve Aegis AI
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please fill out the form below.
  
  - type: input
    id: title
    attributes:
      label: Feature Title
      description: A short, descriptive title for the feature
      placeholder: "Feature: Add voice message support"
    validations:
      required: true
  
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Describe it.
      placeholder: "I want to be able to... because..."
    validations:
      required: true
  
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
      placeholder: "The feature should work like..."
    validations:
      required: true
  
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Have you considered any alternatives?
      placeholder: "Alternative approaches could be..."
  
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context or screenshots about the feature request
  
  - type: checkboxes
    id: terms
    attributes:
      label: Acknowledgments
      options:
        - label: I have searched for existing feature requests and this is not a duplicate
          required: true
        - label: This feature aligns with Aegis AI's goals
          required: false
