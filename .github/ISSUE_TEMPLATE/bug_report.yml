name: Bug Report
description: Report a bug to help us improve
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the form below to help us track and fix the issue.
  
  - type: input
    id: title
    attributes:
      label: Title
      description: A short, descriptive title for the bug
      placeholder: "Bug: Chat message not displaying correctly"
    validations:
      required: true
  
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of what the bug is
      placeholder: "Describe the bug here..."
    validations:
      required: true
  
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead?
      placeholder: "Expected behavior..."
    validations:
      required: true
  
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?
      placeholder: "Actual behavior..."
    validations:
      required: true
  
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots or video to help explain the problem
      placeholder: "Add screenshots here..."
  
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: What environment are you experiencing the bug in?
      options:
        - Web Browser
        - Mobile App
        - Both
        - Other
    validations:
      required: true
  
  - type: dropdown
    id: browser
    attributes:
      label: Browser (if web)
      description: Which browser are you using?
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
  
  - type: input
    id: version
    attributes:
      label: Aegis AI Version
      description: What version of Aegis AI are you using?
      placeholder: "1.0.0"
  
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Please paste any relevant logs or error messages
      render: bash
  
  - type: checkboxes
    id: terms
    attributes:
      label: Acknowledgments
      options:
        - label: I have searched for existing issues and this is not a duplicate
          required: true
        - label: I have provided all the information requested
          required: true
