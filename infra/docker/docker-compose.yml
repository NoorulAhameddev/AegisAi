services:
  # PostgreSQL Database
  postgres:
    image: ankane/pgvector:latest
    container_name: aegis-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-aegis_ai}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aegis-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # Redis Cache and Queue
  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    env_file:
      - .env
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      [
        "sh",
        "-c",
        "redis-server --appendonly yes --requirepass $REDIS_PASSWORD${REDIS_MAXMEMORY:+ --maxmemory $REDIS_MAXMEMORY}${REDIS_MAXMEMORY_POLICY:+ --maxmemory-policy $REDIS_MAXMEMORY_POLICY}",
      ]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aegis-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # Next.js Application
  app:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args:
        NODE_ENV: production
    image: aegis-ai
    env_file:
      - .env
    container_name: aegis-app
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-aegis_ai}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      SITE_NAME: ${SITE_NAME:-Aegis AI}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../uploads:/app/uploads
      - ../../data:/app/data
    restart: unless-stopped
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # Chat Worker
  worker:
    image: aegis-ai
    container_name: aegis-worker
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-aegis_ai}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      SITE_NAME: ${SITE_NAME:-Aegis AI}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    command: ["npm", "run", "worker"]
    volumes:
      - ../../uploads:/app/uploads
      - ../../data:/app/data
    restart: unless-stopped
    networks:
      - aegis-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # RAG Worker
  worker-rag:
    image: aegis-ai
    container_name: aegis-worker-rag
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-aegis_ai}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      SITE_NAME: ${SITE_NAME:-Aegis AI}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    command: ["npm", "run", "worker:rag"]
    volumes:
      - ../../uploads:/app/uploads
      - ../../data:/app/data
    restart: unless-stopped
    networks:
      - aegis-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # WebSocket Worker
  worker-websocket:
    image: aegis-ai
    container_name: aegis-worker-websocket
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
      FRONTEND_URL: ${SITE_URL:-http://localhost:3000}
      WEBSOCKET_PORT: 3001
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    command: ["npm", "run", "worker:websocket"]
    ports:
      - "${WEBSOCKET_PORT:-3001}:3001"
    restart: unless-stopped
    networks:
      - aegis-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  # Automated Database Backup Service
  postgres-backup:
    image: postgres:16-alpine
    container_name: aegis-postgres-backup
    env_file:
      - .env
    environment:
      PGPASSWORD: ${DB_PASSWORD:-postgres}
      PGHOST: postgres
      PGUSER: ${DB_USER:-postgres}
      PGDATABASE: ${DB_NAME:-aegis_ai}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../backups:/backups
    command: >
      sh -c 'while true; do
        echo "[$(date)] Starting backup...";
        pg_dump -h postgres -U $${PGUSER} $${PGDATABASE} | gzip > /backups/db-$(date +\%Y\%m\%d-\%H\%M\%S).sql.gz;
        echo "[$(date)] Backup complete: $(ls -lh /backups | tail -1)";
        find /backups -name "db-*.sql.gz" -mtime +30 -delete;
        echo "[$(date)] Cleaned old backups (30+ days)";
        sleep 86400;
      done'
    restart: unless-stopped
    networks:
      - aegis-network
    profiles:
      - production
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  # Optional: pgAdmin for Database Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aegis-pgadmin
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?PGADMIN_EMAIL is required}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD is required}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - aegis-network
    profiles:
      - dev
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

volumes:
  postgres-data:
  redis-data:

networks:
  aegis-network:
    driver: bridge
